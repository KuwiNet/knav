# knav 镜像发布：推 Docker Hub + GHCR（多架构 amd64/arm64），并把仓库概述同步到 Hub。
#       配了 Secrets ACR_USERNAME / ACR_PASSWORD **且** 仓库变量 ACR_IMAGE 有值时同时推阿里云 ACR，
#       供国内机器直接拉；ACR 登录失败只跳过它，不影响 Hub 与 GHCR。
#
# 触发：打 v* tag 时自动跑；也可在 Actions 页面手动运行（workflow_dispatch）。
# 产物 tag：<版本>（如 0.1.4）与 <主>.<次>（如 0.1）、latest（tag 与默认分支都打）、分支名（手动运行）。
# 版本号标签只有推 v* tag 那次才有：type=semver 解析的是 refs/tags/v*，而 workflow_dispatch 的
# github.ref_type 恒为 branch，手动跑只出 latest + 分支名。
# 没有 DOCKERHUB_USERNAME 这个 Secret 时只推 GHCR，Hub 相关步骤会跳过并打印跳过原因；
# ACR 同理（见上面的 continue-on-error）。
#
# 改这个文件需要令牌带 `workflow` scope：只有 `repo` 会被 GitHub 拒（git push 报
# "resolves to ... outside of allowed paths"，REST 写返回 404 而不是 403）。
# 仓库里只留这一份，不再在 docker/ 下放第二份副本，避免两处漂移。

name: Publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_latest:
        description: 同时把产物标为 latest
        type: boolean
        default: false
      only_description:
        description: 只同步 Docker Hub 概述，不构建镜像（改了 hub-overview.md 时用）
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub 命名空间；改名要同步 docker/install.sh 里的默认镜像地址
  HUB_IMAGE: kuwinet/knav
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # 国内机器直连 Docker Hub 拉不动，所以再加一个阿里云 ACR（个人版）。完整镜像地址放在仓库变量里，
  # 换实例/换地域只改变量：gh variable set ACR_IMAGE --repo KuwiNet/knav --body <registry>/<命名空间>/knav
  # （工作流文件要有 workflow scope 的令牌才能改，变量不用）。命名空间要和「容器镜像服务」里建的一致
  ACR_IMAGE: ${{ vars.ACR_IMAGE }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 只刷新概述时不必陪着跑一次十几分钟的多架构构建
    if: ${{ github.event.inputs.only_description != 'true' }}
    env:
      # Secret 不能直接写在 if 里比较（secrets 上下文在部分场景取不到值），
      # 先落到 job 级 env，再用它判断有没有配 Hub 凭据
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ACR 是「可选」的，所以这一步必须不能拖垮整条发布：Run 42353136580 就是密码不对，
      # 登录失败把后面的构建整个带走，Hub 与 GHCR 一个都没推上去。continue-on-error 只把
      # 真实结果留在 steps.*.outcome 里（conclusion 会被改成 success），下一步据此决定要不要带上 ACR。
      # 用户名是控制台 docker login --username= 后面那串账号全名（RAM 子账号形如 user@主账号别名），
      # 密码要设「固定密码」——临时凭证几十分钟就过期，撑不完一次多架构构建
      - name: 解析 ACR 地址
        if: ${{ env.ACR_USERNAME != '' && env.ACR_IMAGE != '' }}
        id: acr_addr
        run: printf 'registry=%s\n' "${ACR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: 登录阿里云 ACR
        if: ${{ steps.acr_addr.outputs.registry != '' }}
        id: acr
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr_addr.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 计算推送目标
        id: registries
        env:
          ACR_OUTCOME: ${{ steps.acr.outcome }}
        run: |
          imgs="$(printf '%s\n%s' "$HUB_IMAGE" "$GHCR_IMAGE")"
          if [ "${ACR_OUTCOME:-none}" = success ]; then
            imgs="$(printf '%s\n%s' "$imgs" "$ACR_IMAGE")"
          elif [ -z "${ACR_USERNAME:-}" ] || [ -z "${ACR_IMAGE:-}" ]; then
            echo "::notice::未配置 ACR 凭据或仓库变量 ACR_IMAGE，本次不推阿里云 ACR（国内机器仍走 Docker Hub 加速）"
          else
            echo "::warning::ACR 登录失败（用户名要是账号全名、密码要是固定密码，地域要和控制台一致），本次跳过推送 ACR，Hub 与 GHCR 照常发布"
          fi
          {
            echo "images<<EOF"
            echo "$imgs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次推送："; echo "$imgs"

      # 标签规则没变，只是挪到登录之后：images 要等上一步确定推送目标才能算
      - name: 计算镜像标签
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch
            # latest 两条都要：一键安装脚本默认拉 kuwinet/knav:latest，
            # 而 metadata 的 {{is_default_branch}} 在 tag 事件下是 false，光靠它推不出 latest
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hub 的「概述」页就是仓库对象的 full_description 字段，个人账号没有自动读 README 的开关，
  # 空着就显示 "No overview available"。这里以 docker/hub-overview.md 为唯一来源，每次发布 PATCH 一次，
  # 免得仓库文档和网页上粘贴的那份各说各话。不依赖镜像构建，所以和 build 并行。
  hub-description:
    name: 同步 Docker Hub 概述
    runs-on: ubuntu-latest
    env:
      # Secret 不能直接写在 if 里比较（secrets 上下文在部分场景取不到值），先落到 job 级 env
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # 一句话简介：Hub 按 UTF-8 字节算，上限 100（中文一字 3 字节，超了直接 400）
      SUMMARY: knav 导航站：网址收藏 / 文章 / 软件下载，Next.js + MySQL，含账号与后台
    steps:
      - uses: actions/checkout@v4

      - name: PATCH 仓库概述
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::notice::未配置 DOCKERHUB_USERNAME，跳过 Hub 概述同步"
            exit 0
          fi

          # auth.docker.io 发的 JWT 只有 registry 作用域（推镜像够用），拿它 PATCH 网站 API 会 401；
          # 改仓库元数据要走 Hub 自己的登录接口拿账号级 JWT，PAT 当密码传即可。
          # 凭据交给 python 组 JSON，避免口令里出现引号或 $ 时把命令行拼坏
          code="$(curl -sS -o /tmp/hub-login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os;print(json.dumps({"username":os.environ["DOCKERHUB_USERNAME"],"password":os.environ["DOCKERHUB_TOKEN"]}))')" \
            "https://hub.docker.com/v2/users/login/")"
          if [ "$code" != 200 ]; then
            echo "Hub 登录失败：HTTP $code（用户名与令牌不配对，或令牌已被回收）" >&2
            exit 1
          fi
          # 响应里 token 与 refresh_token 都在，用 json 取，别用贪婪正则（会捞到 refresh_token）
          jwt="$(python3 -c 'import json;print(json.load(open("/tmp/hub-login.json",encoding="utf-8")).get("token",""))')"
          if [ -z "$jwt" ]; then
            echo "Hub 登录返回 200 但没有 token 字段，接口形态变了" >&2
            exit 1
          fi

          # JSON 交给 python 转义：正文里有反引号、引号和多行，手拼字符串迟早踩坑
          # 简介按 UTF-8 字节算，超过 100 会被 Hub 拒成 400，这里先自己挡一道
          bytes="$(printf %s "$SUMMARY" | wc -c)"
          if [ "$bytes" -gt 100 ]; then
            echo "SUMMARY 超长：$bytes 字节，Hub 简介上限 100（中文按 3 字节计）" >&2
            exit 1
          fi
          payload="$(python3 -c 'import json,sys;print(json.dumps({"description":sys.argv[1],"full_description":open(sys.argv[2],encoding="utf-8").read()}))' \
            "$SUMMARY" docker/hub-overview.md)"

          code="$(curl -sS -o /tmp/hub-resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://hub.docker.com/v2/repositories/${HUB_IMAGE}/")"
          if [ "$code" != 200 ] && [ "$code" != 201 ]; then
            echo "Hub 概述更新失败：HTTP $code" >&2
            cat /tmp/hub-resp.json >&2
            exit 1
          fi
          echo "Hub 概述已更新（来源 docker/hub-overview.md，$(wc -c < docker/hub-overview.md) 字节）"
