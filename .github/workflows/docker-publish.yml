# knav 镜像发布：推 Docker Hub + GHCR（多架构 amd64/arm64）。
#
# 这个文件放在 docker/ 而不是 .github/workflows/ 是因为 KuwiNet 的 API token 没有
# `workflow` 权限，agent 提交 .github/workflows/* 会被 GitHub 直接拒绝。
# 启用方式：把本文件原样复制到 .github/workflows/docker-publish.yml 并提交一次，
# 同时在仓库 Secrets 里加 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（不加就只推 GHCR）。
#
# 触发：打 v* tag 时自动跑；也可在 Actions 页面手动运行（workflow_dispatch）。
# 产物 tag：<版本>（如 0.1.4）、latest（tag 与默认分支都打）、分支名（手动运行）。
# 没有 DOCKERHUB_USERNAME 这个 Secret 时只推 GHCR，Hub 那步会跳过并打印跳过原因。

name: Publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_latest:
        description: 同时把产物标为 latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub 命名空间；改名要同步 docker/install.sh 里的 KNAV_IMAGE 默认值
  HUB_IMAGE: kuwinet/knav
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secret 不能直接写在 if 里比较（secrets 上下文在部分场景取不到值），
      # 先落到 job 级 env，再用它判断有没有配 Hub 凭据
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 计算镜像标签
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.HUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch
            # latest 两条都要：一键安装脚本默认拉 kuwinet/knav:latest，
            # 而 metadata 的 {{is_default_branch}} 在 tag 事件下是 false，光靠它推不出 latest
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
