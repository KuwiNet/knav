# knav 镜像发布：推 Docker Hub + GHCR + 阿里云 ACR（多架构 amd64/arm64），并把仓库概述同步到 Hub。
#       ACR 是可选的：配了 Secrets ACR_USERNAME / ACR_PASSWORD **且** 仓库变量 ACR_IMAGE 有值才推，
#       登录失败只跳过它，不影响 Hub 与 GHCR——国内机器直接拉这个地址。
#
# 构建形态：两个架构各一个 job，用各自架构的原生 runner，产物先落 GHCR 的 <tag>-amd64 / <tag>-arm64，
#       最后一个 job 把它们合成 manifest list 再推三个仓库。
#       为什么不一个 job 带 platforms=amd64,arm64：x86 runner 上 arm64 只能 qemu 模拟，
#       实测 Run 42359760772 里 arm64 的「RUN npm ci」87 分钟没跑完（那层缓存也没命中），而 amd64 全程 62 秒。
#       中间标签只留 GHCR 一处，Hub 的 tag 列表是给用户看的；每次发版 GHCR 多两条 -amd64/-arm64。
#
# 触发：打 v* tag 时自动跑；也可在 Actions 页面手动运行（workflow_dispatch）。
# 产物 tag：<版本>（如 0.1.4）与 <主>.<次>（如 0.1）、latest（tag 与默认分支都打）、git tag 原名（如 v0.1.4）。
# 版本号标签只有推 v* tag 那次才有：type=semver 解析的是 refs/tags/v*，而 workflow_dispatch 的
# github.ref_type 恒为 branch，手动跑只出 latest。
# **不再打分支名 tag（原先的 main）**：它只在手动 dispatch 分支时产生，内容永远落后于最新版本号 tag，
# 用户容易误拉旧镜像。Hub 上已经存在的 main tag 用 workflow_dispatch 的 delete_tags 输入删掉。
# 没有 DOCKERHUB_USERNAME 这个 Secret 时只推 GHCR，Hub 相关步骤会跳过并打印跳过原因。
#
# 改这个文件：HTTPS + PAT 推需要令牌带 `workflow` scope（只有 `repo` 会被 GitHub 拒，
# REST 写还返回 404 而不是 403）；SSH 推不受这条限制。
# 仓库里只留这一份，不再在 docker/ 下放第二份副本，避免两处漂移。

name: Publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_latest:
        description: 同时把产物标为 latest
        type: boolean
        default: false
      only_description:
        description: 只同步 Docker Hub 概述，不构建镜像（改了 hub-overview.md 时用）
        type: boolean
        default: false
      delete_tags:
        description: 删除 Docker Hub 上这些过时的 tag（逗号分隔，如 main）
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub 命名空间；改名要同步 docker/install.sh 里的默认镜像地址
  HUB_IMAGE: kuwinet/knav
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # 国内机器直连 Docker Hub 拉不动，所以再加一个阿里云 ACR（个人版）。完整镜像地址放在仓库变量里，
  # 换实例/换地域只改变量：gh variable set ACR_IMAGE --repo KuwiNet/knav --body <registry>/<命名空间>/knav
  # （工作流文件要有 workflow scope 的令牌才能改，变量不用）。命名空间要和「容器镜像服务」里建的一致
  ACR_IMAGE: ${{ vars.ACR_IMAGE }}

jobs:
  # 每个架构单独构建，只推 GHCR 的带后缀标签；两个 job 并行，各自跑在对应架构的 runner 上。
  # ubuntu-24.04-arm 是 GitHub 对公开仓库免费开放的 arm64 原生 runner，私有仓库用它会直接失败
  build-arch:
    name: 构建 ${{ matrix.suffix }}
    runs-on: ${{ matrix.runs-on }}
    # 只刷新概述时不必陪着跑一次构建
    if: ${{ github.event.inputs.only_description != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 这套标签规则和 merge job 那份必须一致，改一处要改两处
      - name: 计算镜像标签
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            # 不再打分支名 tag（原先的 main）：它只在手动 dispatch 分支时产生，内容会永远落后于
            # 最新版本号 tag，用户容易误拉旧镜像。最新版本一律用 latest / 0.1.x / v0.1.x 表达。
            # latest 两条都要：一键安装脚本默认拉 kuwinet/knav:latest，
            # 而 metadata 的 {{is_default_branch}} 在 tag 事件下是 false，光靠它推不出 latest
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: 加架构后缀
        id: arch
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS" | sed "s|$|-${SUFFIX}|"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送本架构
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.arch.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 单架构产物是下一步 imagetools 的输入：带 attestation 时它是个 index 而不是裸 image manifest，
          # 合成出来的多架构清单里会混进说不清的条目
          provenance: false
          sbom: false
          # scope 按架构分开，两个 job 同时写同一份 GHA 缓存会互相抢
          # （今天日志里就有 "Unable to reserve cache ... another job may be creating this cache"）
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  # 把两个架构合成 manifest list 推到三个仓库。只搬 manifest 和层，不重新构建，所以 amd64 runner 够用
  merge:
    name: 合成多架构并推送
    runs-on: ubuntu-24.04
    needs: build-arch
    env:
      # Secret 不能直接写在 if 里比较（secrets 上下文在部分场景取不到值），先落到 job 级 env
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ACR 是「可选」的，所以这一步不能拖垮整条发布：Run 42353136580 就是密码不对，登录失败
      # 把后面的推送整个带走，Hub 与 GHCR 一个都没推上去。continue-on-error 只把真实结果留在
      # steps.*.outcome 里（conclusion 会被改成 success），下一步据此决定要不要带上 ACR。
      # 用户名是控制台 docker login --username= 后面那串账号全名（RAM 子账号形如 user@主账号别名），
      # 密码要设「固定密码」——临时凭证几十分钟就过期，撑不完一次发布
      - name: 解析 ACR 地址
        if: ${{ env.ACR_USERNAME != '' && env.ACR_IMAGE != '' }}
        id: acr_addr
        run: printf 'registry=%s\n' "${ACR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: 登录阿里云 ACR
        if: ${{ steps.acr_addr.outputs.registry != '' }}
        id: acr
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr_addr.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 计算推送目标
        id: registries
        env:
          ACR_OUTCOME: ${{ steps.acr.outcome }}
        run: |
          # docker 引用名不允许大写，而 GHCR_IMAGE 用的是 github.repository（KuwiNet/knav）。
          # 以前交给 build-push-action 会自动小写化，现在 imagetools 是命令行直接拼，必须自己归一，
          # 否则报 "invalid reference format: repository name (KuwiNet/knav) must be lowercase"（Run 42367319815）
          imgs="$(printf '%s\n%s' "$HUB_IMAGE" "$GHCR_IMAGE" | tr 'A-Z' 'a-z')"
          if [ "${ACR_OUTCOME:-none}" = success ]; then
            imgs="$(printf '%s\n%s' "$imgs" "$ACR_IMAGE" | tr 'A-Z' 'a-z')"
          elif [ -z "${ACR_USERNAME:-}" ] || [ -z "${ACR_IMAGE:-}" ]; then
            echo "::notice::未配置 ACR 凭据或仓库变量 ACR_IMAGE，本次不推阿里云 ACR（国内机器仍走 Docker Hub 加速）"
          else
            echo "::warning::ACR 登录失败（用户名要是账号全名、密码要是固定密码，地域要和控制台一致），本次跳过推送 ACR，Hub 与 GHCR 照常发布"
          fi
          {
            echo "images<<EOF"
            echo "$imgs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次推送："; echo "$imgs"

      # 标签规则和 build-arch 那份一致；这里只按 GHCR 算，因为带架构后缀的中间产物只在 GHCR，
      # 三个目标地址由上一步的 images 列表拼出来
      - name: 计算镜像标签
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            # 不再打分支名 tag（原先的 main）：它只在手动 dispatch 分支时产生，内容会永远落后于
            # 最新版本号 tag，用户容易误拉旧镜像。最新版本一律用 latest / 0.1.x / v0.1.x 表达。
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: 合成 manifest list 并推送
        env:
          IMAGES: ${{ steps.registries.outputs.images }}
          SRCS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          n=0
          for src in $SRCS; do
            tag="${src##*:}"
            args=()
            for img in $IMAGES; do args+=(-t "$img:$tag"); done
            echo "== $tag => ${args[*]//-t /}"
            docker buildx imagetools create "${args[@]}" "$src-amd64" "$src-arm64"
            n=$((n + 1))
          done
          echo "本次合成 $n 个标签"

      # 产物级核对：每个目标仓库、每个标签都要同时看到 amd64 和 arm64。
      # 光打印不够——只出一个架构时 grep 照样成功，得自己判
      - name: 核对各仓库的架构清单
        env:
          IMAGES: ${{ steps.registries.outputs.images }}
          SRCS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          bad=0
          for src in $SRCS; do
            tag="${src##*:}"
            for img in $IMAGES; do
              archs="$(docker manifest inspect "$img:$tag" \
                | grep -o '"architecture": *"[a-z0-9]*"' | sed 's/.*"\([a-z0-9]*\)"$/\1/' | sort | tr '\n' ' ')"
              case "$archs" in
                *amd64*arm64*) printf 'OK   %s:%s -> %s\n' "$img" "$tag" "$archs" ;;
                *) printf 'FAIL %s:%s -> %s\n' "$img" "$tag" "${archs:-空}" >&2; bad=1 ;;
              esac
            done
          done
          [ "$bad" = 0 ] || { echo "有目标仓库的清单里架构不全，见上面 FAIL 行" >&2; exit 1; }

  # Hub 的「概述」页就是仓库对象的 full_description 字段，个人账号没有自动读 README 的开关，
  # 空着就显示 "No overview available"。这里以 docker/hub-overview.md 为唯一来源，每次发布 PATCH 一次，
  # 免得仓库文档和网页上粘贴的那份各说各话。不依赖镜像构建，所以和 build 并行。
  hub-description:
    name: 同步 Docker Hub 概述
    runs-on: ubuntu-latest
    env:
      # Secret 不能直接写在 if 里比较（secrets 上下文在部分场景取不到值），先落到 job 级 env
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # 一句话简介：Hub 按 UTF-8 字节算，上限 100（中文一字 3 字节，超了直接 400）
      SUMMARY: knav 导航站：网址收藏 / 文章 / 软件下载，Next.js + MySQL，含账号与后台
    steps:
      - uses: actions/checkout@v4

      - name: PATCH 仓库概述
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::notice::未配置 DOCKERHUB_USERNAME，跳过 Hub 概述同步"
            exit 0
          fi

          # auth.docker.io 发的 JWT 只有 registry 作用域（推镜像够用），拿它 PATCH 网站 API 会 401；
          # 改仓库元数据要走 Hub 自己的登录接口拿账号级 JWT，PAT 当密码传即可。
          # 凭据交给 python 组 JSON，避免口令里出现引号或 $ 时把命令行拼坏
          code="$(curl -sS -o /tmp/hub-login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os;print(json.dumps({"username":os.environ["DOCKERHUB_USERNAME"],"password":os.environ["DOCKERHUB_TOKEN"]}))')" \
            "https://hub.docker.com/v2/users/login/")"
          if [ "$code" != 200 ]; then
            echo "Hub 登录失败：HTTP $code（用户名与令牌不配对，或令牌已被回收）" >&2
            exit 1
          fi
          # 响应里 token 与 refresh_token 都在，用 json 取，别用贪婪正则（会捞到 refresh_token）
          jwt="$(python3 -c 'import json;print(json.load(open("/tmp/hub-login.json",encoding="utf-8")).get("token",""))')"
          if [ -z "$jwt" ]; then
            echo "Hub 登录返回 200 但没有 token 字段，接口形态变了" >&2
            exit 1
          fi

          # JSON 交给 python 转义：正文里有反引号、引号和多行，手拼字符串迟早踩坑
          # 简介按 UTF-8 字节算，超过 100 会被 Hub 拒成 400，这里先自己挡一道
          bytes="$(printf %s "$SUMMARY" | wc -c)"
          if [ "$bytes" -gt 100 ]; then
            echo "SUMMARY 超长：$bytes 字节，Hub 简介上限 100（中文按 3 字节计）" >&2
            exit 1
          fi
          payload="$(python3 -c 'import json,sys;print(json.dumps({"description":sys.argv[1],"full_description":open(sys.argv[2],encoding="utf-8").read()}))' \
            "$SUMMARY" docker/hub-overview.md)"

          code="$(curl -sS -o /tmp/hub-resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://hub.docker.com/v2/repositories/${HUB_IMAGE}/")"
          if [ "$code" != 200 ] && [ "$code" != 201 ]; then
            echo "Hub 概述更新失败：HTTP $code" >&2
            cat /tmp/hub-resp.json >&2
            exit 1
          fi
          echo "Hub 概述已更新（来源 docker/hub-overview.md，$(wc -c < docker/hub-overview.md) 字节）"

      # 删各仓库上的过时 tag（比如不再生产的 main）：
      #   Hub  → 账号级 JWT 的 web API（DELETE /v2/repositories/<命名空间>/<仓库>/tags/<tag>）
      #   GHCR → registry 层不支持删 manifest（实测 405 UNSUPPORTED），走 GitHub Packages REST API 删版本
      #   ACR  → 试 registry v2 的 manifest DELETE（ACR 若不支持就打印原因，不影响别的仓库）
      # 用 workflow_dispatch 的 delete_tags 输入触发（逗号分隔的 tag 名）。
      - name: 删除 Docker Hub 上的过时 tag
        if: ${{ github.event.inputs.delete_tags != '' }}
        env:
          DELETE_TAGS: ${{ github.event.inputs.delete_tags }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::notice::未配置 DOCKERHUB_USERNAME，跳过 Hub 上的删除"
            exit 0
          fi

          code="$(curl -sS -o /tmp/hub-login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os;print(json.dumps({"username":os.environ["DOCKERHUB_USERNAME"],"password":os.environ["DOCKERHUB_TOKEN"]}))')" \
            "https://hub.docker.com/v2/users/login/")"
          if [ "$code" != 200 ]; then
            echo "Hub 登录失败：HTTP $code" >&2
            exit 1
          fi
          jwt="$(python3 -c 'import json;print(json.load(open("/tmp/hub-login.json",encoding="utf-8")).get("token",""))')"
          if [ -z "$jwt" ]; then
            echo "Hub 登录返回 200 但没有 token 字段，接口形态变了" >&2
            exit 1
          fi

          IFS=',' read -ra tags <<< "$DELETE_TAGS"
          for t in "${tags[@]}"; do
            t="$(printf '%s' "$t" | tr -d '[:space:]')"
            [ -n "$t" ] || continue
            code="$(curl -sS -o /tmp/hub-del.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $jwt" \
              "https://hub.docker.com/v2/repositories/${HUB_IMAGE}/tags/$t")"
            case "$code" in
              200|202|204) echo "Hub：已删除 tag $t" ;;
              404) echo "Hub：tag $t 本来就不存在，跳过" ;;
              *) echo "Hub：删除 tag $t 失败：HTTP $code" >&2; cat /tmp/hub-del.json >&2; exit 1 ;;
            esac
          done

      - name: 删除 GHCR 上的过时 tag
        if: ${{ github.event.inputs.delete_tags != '' }}
        env:
          DELETE_TAGS: ${{ github.event.inputs.delete_tags }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, sys, urllib.error, urllib.request

          token = os.environ["GHCR_TOKEN"]
          owner = os.environ["GHCR_OWNER"]
          package = "knav"
          targets = [t.strip() for t in os.environ["DELETE_TAGS"].split(",") if t.strip()]

          def api(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com" + path, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, str(e).encode()

          def list_versions():
              for path in ("/user/packages/container/{}/versions?per_page=100".format(package),
                           "/users/{}/packages/container/{}/versions?per_page=100".format(owner, package)):
                  st, body = api(path)
                  if st == 200:
                      try:
                          return path, json.loads(body)
                      except Exception:
                          pass
                  print("GHCR：列版本 {} 失败 → HTTP {} {}".format(path, st, body[:120]))
              return None, []

          list_path, items = list_versions()
          if not list_path:
              print("GHCR：拿不到版本列表，跳过删除")
              sys.exit(0)
          print("GHCR：版本列表来自 {}".format(list_path))
          for item in items:
              meta = item.get("metadata") or {}
              tags = list((meta.get("container") or {}).get("tags") or [])
              hit = [t for t in tags if t in targets]
              if not hit:
                  continue
              extra = sorted(set(tags) - set(hit))
              if extra:
                  print("GHCR：版本 {} 上还有别的 tag {}，跳过（删版本会连它们一起删）".format(item["id"], extra))
                  continue
              st, body = api("/user/packages/container/{}/versions/{}".format(package, item["id"]), method="DELETE")
              if st not in (200, 202, 204):
                  st, body = api("/users/{}/packages/container/{}/versions/{}".format(owner, package, item["id"]), method="DELETE")
              if st in (200, 202, 204):
                  print("GHCR：已删除 tag {}（版本 {}）".format(",".join(hit), item["id"]))
              else:
                  print("GHCR：删除版本 {} 失败：HTTP {} {}".format(item["id"], st, body[:160]))
          PYEOF

      - name: 删除 ACR 上的过时 tag
        if: ${{ github.event.inputs.delete_tags != '' }}
        env:
          DELETE_TAGS: ${{ github.event.inputs.delete_tags }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_USERNAME:-}" ] || [ -z "${ACR_IMAGE:-}" ]; then
            echo "::notice::未配置 ACR 凭据或 ACR_IMAGE，跳过 ACR 上的删除"
            exit 0
          fi
          cat > /tmp/del-tag.py <<'PYEOF'
          import base64, json, re, sys, urllib.error, urllib.parse, urllib.request

          ACCEPT = ",".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def request(url, method="GET", headers=None):
              req = urllib.request.Request(url, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, {k.lower(): v for k, v in resp.headers.items()}, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, {k.lower(): v for k, v in e.headers.items()}, e.read()
              except Exception as e:
                  return 0, {}, str(e).encode()

          def parse_challenge(value):
              # 形如：Bearer realm="https://host/auth",service="svc",scope="repository:x:pull"
              return {k.lower(): v for k, v in re.findall(r'([A-Za-z_]+)="([^"]*)"', value)}

          def decode_scope(tok):
              # ACR 的 token 是 JWT，第二段里能看到拿到的权限动作
              try:
                  seg = tok.split(".")[1]
                  seg += "=" * (-len(seg) % 4)
                  data = json.loads(base64.urlsafe_b64decode(seg).decode("utf-8", "replace"))
                  return data.get("access") or data.get("scope") or data
              except Exception:
                  return "无法解析"

          def get_token(host, repo, user, password):
              st, hdrs, _ = request(
                  "https://{}/v2/{}/manifests/knav-delete-probe".format(host, repo),
                  headers={"Accept": ACCEPT})
              chal = hdrs.get("www-authenticate") or ""
              c = parse_challenge(chal)
              realm = c.get("realm") or "https://{}/token".format(host)
              service = c.get("service") or host.split(":")[0]
              scopes = []
              for s in ("repository:{}:pull,push,delete".format(repo),
                        "repository:{}:pull,push".format(repo),
                        c.get("scope")):
                  if s and s not in scopes:
                      scopes.append(s)
              auth = "Basic " + base64.b64encode("{}:{}".format(user, password).encode()).decode()
              last = ""
              for scope in scopes:
                  # ACR 的 auth 端点对 %3A / %2C 不解码，service 与 scope 里的 : , 保持原样
                  url = "{}?service={}&scope={}".format(realm, service, scope)
                  st, _, body = request(url, headers={"Authorization": auth})
                  if st != 200:
                      last = "HTTP {}".format(st)
                      print("ACR：取 token 失败 {}（scope {}）{}".format(last, scope, body[:120]))
                      continue
                  try:
                      data = json.loads(body)
                  except Exception:
                      last = "响应不是 JSON"
                      continue
                  tok = data.get("token") or data.get("access_token")
                  if tok:
                      print("ACR：token scope={}".format(decode_scope(tok)))
                      return tok, ""
                  last = "响应里没有 token 字段"
              return None, last

          def delete_tag(host, repo, tag, user, password):
              token, err = get_token(host, repo, user, password)
              if not token:
                  return "取 token 失败（{}）".format(err)
              url = "https://{}/v2/{}/manifests/{}".format(host, repo, tag)
              auth = {"Authorization": "Bearer " + token, "Accept": ACCEPT}
              st, hdrs, body = request(url, method="HEAD", headers=auth)
              if st == 404:
                  return "本来就不存在"
              if st != 200:
                  return "取 manifest 失败：HTTP {} {}".format(st, body[:120])
              digest = hdrs.get("docker-content-digest") or hdrs.get("Docker-Content-Digest")
              if not digest:
                  return "响应里没有 digest"
              st, _, body = request(
                  "https://{}/v2/{}/manifests/{}".format(host, repo, digest),
                  method="DELETE", headers={"Authorization": "Bearer " + token})
              if st in (200, 202, 204):
                  return "已删除（digest {}）".format(digest[:19])
              # 有些 registry 不接受按 digest 删，只认 tag 引用
              st2, _, body2 = request(
                  "https://{}/v2/{}/manifests/{}".format(host, repo, tag),
                  method="DELETE", headers={"Authorization": "Bearer " + token})
              if st2 in (200, 202, 204):
                  return "已删除（按 tag 引用）"
              return "删除失败：digest HTTP {} {}；tag HTTP {} {}".format(st, body[:100], st2, body2[:100])

          host, repo, user, password, tag = sys.argv[1:6]
          print("{}:{} → {}".format(host, repo, tag), delete_tag(host, repo, tag, user, password))
          PYEOF

          acr_host="${ACR_IMAGE%%/*}"
          acr_repo="${ACR_IMAGE#*/}"
          IFS=',' read -ra tags <<< "$DELETE_TAGS"
          for t in "${tags[@]}"; do
            t="$(printf '%s' "$t" | tr -d '[:space:]')"
            [ -n "$t" ] || continue
            python3 /tmp/del-tag.py "$acr_host" "$acr_repo" "$ACR_USERNAME" "$ACR_PASSWORD" "$t" | sed 's/^/ACR：/'
          done
